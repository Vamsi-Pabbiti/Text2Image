<!DOCTYPE html>
<html>
<head>
    <title>AI Image Generator</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 50px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; width: 100%; }
        .error { color: #721c24; background: #f8d7da; padding: 10px; border-radius: 5px; margin-top: 20px; border: 1px solid #f5c6cb; }
        img { max-width: 100%; border-radius: 10px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #loading-text { display: none; color: #666; margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Free AI Image Generator</h2>
    <form method="POST" onsubmit="document.getElementById('loading-text').style.display='block'">
        <textarea name="prompt" placeholder="Describe what you want to see..."></textarea>
        <button type="submit">Generate Image</button>
    </form>

    <p id="loading-text">✨ AI is thinking... this may take up to a minute...</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if image_filename %}
        <h3>Result:</h3>
        <img src="{{ url_for('static', filename='images/' + image_filename) }}">
        <br>
        <a href="{{ url_for('static', filename='images/' + image_filename) }}" download>
            <button style="background: #28a745;">Download Image</button>
        </a>
    {% endif %}
</div>

</body>
</html>
